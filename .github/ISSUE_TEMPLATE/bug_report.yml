name: Bug 报告
description: 提交一个 Bug 报告
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请尽量填写以下信息，帮助我们快速定位问题。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述遇到的问题
      placeholder: 发生了……期望的行为是……
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开应用
        2. 点击……
        3. 看到报错
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 帮助 > 关于 中显示的版本号
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10
        - Windows 11
        - macOS
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 日志目录 AppData/logs 下的相关日志内容
      render: shell
