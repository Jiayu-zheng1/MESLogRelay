name: 功能建议
description: 提出一个新的功能建议
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢您的建议！请描述清楚您期望的功能及其使用场景。
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 您期望的功能是什么？
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 这个功能解决什么问题？在什么场景下使用？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 目前是否有变通方式？是否参考过其他实现？
