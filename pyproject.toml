[project]
name = "MooseUpload"
version = "1.4.4"
description = "Moose SMT Upload Tool"
readme = "README.md"
requires-python = ">=3.8.10"
dependencies = [
    "loguru>=0.7.3",
    "psutil",
    "peewee",
    "watchdog",
    "PySide6",
    "PySide6-Fluent-Widgets",
    "portalocker",
    "pyftpdlib",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
build = [
    "pyinstaller",
    "pyarmor>=8.0.0",
]
